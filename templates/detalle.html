<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ ot }} | Grupo Malla</title>
    {% from '_head_assets.html' import head_assets %}
    {{ head_assets() }}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-container">
            <span><i class="fa fa-phone"></i> <a href="tel:+34971002800">+34 971 00 28 00</a></span>
        </div>
    </div>
    {% from '_nav.html' import nav %}
    {{ nav('') }}
    <main class="main-content">
        <a class="volver" id="enlace-volver" href="/"><i class="fa fa-arrow-left"></i> Volver al listado</a>
        <p id="detalle-error" class="error-banner" hidden></p>
        <article id="detalle" class="detalle" hidden>
            <header class="page-head">
                <h2 id="detalle-titulo"></h2>
                <p id="detalle-estado" class="muted"></p>
            </header>
            <dl id="detalle-datos" class="detalle-datos"></dl>
            <h3>Líneas</h3>
            <div class="orden-lista">
                <table>
                    <thead>
                        <tr><th>Código</th><th>Descripción</th><th>Cantidad</th></tr>
                    </thead>
                    <tbody id="detalle-lineas"></tbody>
                </table>
            </div>
            <button type="button" id="btn-valorar" class="btn-accent" hidden>Dar el ok</button>
        </article>
    </main>
    {% include '_auth_modal.html' %}
    <script id="sso-config-json" type="application/json">{{ {'enabled': sso_enabled, 'launch_url': sso_launch_url} | tojson }}</script>
    <script>
        window.ORDEN_NO = {{ no|tojson }};
        window.ORDEN_VISTA = {{ vista|tojson }};
        window.ORDENES_REQUIRE_LOGIN = true;
    </script>
    <script src="{{ url_for('static', filename='auth.js') }}"></script>
    <script src="{{ url_for('static', filename='detalle.js') }}"></script>
</body>
</html>
